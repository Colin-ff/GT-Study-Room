<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Browse preloaded General Training reading and writing practice tests.">
<title>IELTS GT Practice · __TITLE__</title>
<style>
:root{color-scheme:light;--navy:#142640;--ink:#18253a;--muted:#526278;--line:#dce4ed;--blue:#1758b0;--paper:#f0f4f9}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
header{background:var(--navy);color:#fff;padding:14px max(24px,calc((100vw - 1090px)/2));font-weight:700}
main{max-width:1140px;margin:auto;padding:46px 24px}.eyebrow{font-size:12px;letter-spacing:.13em;text-transform:uppercase;font-weight:750;color:var(--blue)}h1{font-size:clamp(32px,6vw,54px);line-height:1.1;margin:8px 0 12px}h2{margin:0;font-size:21px}h3{margin:0 0 5px;font-size:22px}p{margin:0 0 10px}.intro,.description,.status{color:var(--muted)}
.tests{display:grid;grid-template-columns:repeat(auto-fit,minmax(216px,1fr));gap:12px}.test{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}.description,.status{font-size:13px}.description{margin-bottom:16px}.modules{display:grid;gap:8px}.modules a{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--ink);padding:8px 9px;border:1px solid var(--line);border-radius:6px;text-decoration:none;font-size:14px;font-weight:650}.modules a:hover{background:#e7eff9}.modules a:focus-visible{outline:3px solid #578ae3;outline-offset:2px}.status{font-weight:400;text-align:right}.privacy{margin-top:26px;font-size:13px;color:var(--muted)}
.tests{margin-top:26px}.test-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.progress{background:#e7eff9;border-radius:100px;padding:4px 9px;font-size:13px;white-space:nowrap}.book-link{display:block;color:inherit;text-decoration:none}.book-link:hover{border-color:var(--blue);background:#f7fbff}.book-link .description{margin-top:7px}.open-book,.back{color:var(--blue);font-size:14px;font-weight:650}.back{display:inline-block;margin-bottom:20px}
</style>
</head>
<body>
<header>IELTS GT Practice</header>
<main>
__BACK__
  <p class="eyebrow">General Training</p>
  <h1>__TITLE__</h1>
  <p class="intro">__INTRO__</p>
  <div class="tests">__CARDS__</div>
  <p class="privacy">Your progress, drafts and submitted attempts are saved in this browser.</p>
</main>
<script>
"use strict";
const wordCount = text => (String(text ?? "").trim().match(/\S+/g) || []).length;
function moduleProgress(record, mode, readingTotal) {
  const attempt = record?.attempts?.[mode];
  if (attempt?.submittedAt) return 100;
  const history = record?.history;
  if (!attempt?.deadline && Array.isArray(history) && history.some(entry => entry.module === mode)) return 100;
  if (mode === "reading") {
    const answered = Object.values(attempt?.answers || {}).filter(value => String(value ?? "").trim()).length;
    return answered || attempt?.deadline ? Math.min(100, answered * 100 / readingTotal) : null;
  }
  const [first, second] = attempt?.drafts || [];
  const words = [wordCount(first), wordCount(second)];
  return words.some(Boolean) || attempt?.deadline
    ? 50 * (Math.min(1, words[0] / 150) + Math.min(1, words[1] / 250)) : null;
}
function formatProgress(progress) {
  return progress === null ? "未练习" : Math.round(progress) + "%";
}
function showProgress() {
  for (const card of document.querySelectorAll("[data-storage-key]")) {
    let record = null;
    try {
      record = JSON.parse(localStorage.getItem(card.dataset.storageKey));
    } catch {
      // Leave the default status when browser storage is unavailable.
    }
    const reading = moduleProgress(record, "reading", Number(card.dataset.readingTotal));
    const writing = moduleProgress(record, "writing");
    card.querySelector('[data-module="reading"]').textContent = formatProgress(reading);
    card.querySelector('[data-module="writing"]').textContent = formatProgress(writing);
    const total = reading === null && writing === null ? null : ((reading ?? 0) + (writing ?? 0)) / 2;
    card.querySelector("[data-total]").textContent = formatProgress(total);
  }
}
window.addEventListener("pageshow", showProgress);
window.addEventListener("storage", showProgress);
</script>
</body>
</html>

<body>
<header>
  <div class="tabs"><a class="home-link" href="__BOOK_URL__">‹ Book tests</a><div class="brand"><span class="eyebrow">G Study Room · __BOOK_LABEL__</span><strong>__TEST_LABEL__</strong></div></div>
  <nav class="tabs" aria-label="Module"><button id="reading-tab">Reading</button><button id="writing-tab">Writing</button></nav>
  <div class="actions"><span id="clock" aria-label="Time remaining"></span><button id="start-timer">Start timer</button><button id="history-button">History</button><button id="submit" class="primary">Submit</button></div>
</header>
<main class="shell">
  <nav class="section-nav" id="sections" aria-label="Question groups"></nav>
  <nav class="numbers" id="numbers" aria-label="Question numbers"></nav>
  <nav id="review-filters" class="review-filters" aria-label="Review filters" hidden></nav>
  <div id="summary" class="summary" role="status" hidden></div>
  <div id="storage-warning" class="summary" hidden>This browser is blocking local storage. Answers and history are available during this visit.</div>
  <div id="study-layout" class="study-layout"><div id="workspace" class="workspace"></div></div>
</main>
<dialog id="history">
  <div class="dialog-head"><h2>Attempt history</h2><form method="dialog"><button>Close</button></form></div>
  <div id="history-list"></div>
</dialog>
<dialog id="submit-dialog">
  <h2>Submit this attempt?</h2>
  <p>Your work will be saved to History and locked for review.</p>
  <form method="dialog" class="actions">
    <button value="cancel" autofocus>Keep working</button>
    <button value="submit" class="primary">Submit attempt</button>
  </form>
</dialog>
<script type="application/json" id="test-data">__EXAM_DATA__</script>
<script>
"use strict";
__VOCAB_JS__
const data = JSON.parse(document.querySelector("#test-data").textContent);
const questions = data.groups.flatMap(group => group.questions);
const storageKey = data.storageKey;
const $ = selector => document.querySelector(selector);
const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g, character => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
})[character]);
const normalize = value => String(value ?? "").trim().replace(/\s+/g, " ").toLowerCase();
const countWords = value => (value.trim().match(/\S+/g) || []).length;
const isCorrect = (question, answers) =>
  (question.accepted || [question.answer]).some(answer => normalize(answers[question.id]) === normalize(answer));
const grade = answers => questions.filter(question => isCorrect(question, answers)).length;
const newAttempt = () => ({
  deadline: null, answers: {}, flags: {}, highlights: {},
  drafts: ["", ""], submittedAt: null
});
function migrateHighlights(state) {
  const moves = data.highlightMoves;
  if (!moves || state.highlightRevision === 1) return;
  const attempts = [state.attempts.reading, ...state.history.filter(entry => entry.module === "reading")];
  for (const attempt of attempts) {
    if (!attempt?.highlights) continue;
    const updated = {};
    for (const [key, ranges] of Object.entries(attempt.highlights)) {
      const move = moves[key];
      if (move === null) continue;
      const [target, minimum, offset] = move || [key, 0, 0];
      for (const [start, end] of ranges) {
        if (end <= minimum) continue;
        (updated[target] ||= []).push([Math.max(start, minimum) + offset, end + offset]);
      }
    }
    for (const ranges of Object.values(updated)) ranges.sort((a, b) => a[0] - b[0]);
    attempt.highlights = updated;
  }
  state.highlightRevision = 1;
}

const state = {attempts: {}, history: []};
try {
  const saved = JSON.parse(localStorage.getItem(storageKey));
  if (saved) Object.assign(state, saved);
  migrateHighlights(state);
} catch {
  $("#storage-warning").hidden = false;
}
function save() {
  try {
    localStorage.setItem(storageKey, JSON.stringify(state));
  } catch {
    $("#storage-warning").hidden = false;
  }
}
let mode = "reading";
let groupIndex = 0;
let writingIndex = 0;
let currentQuestion = null;
let review = null;
let selection = [];
const attempt = () => review || state.attempts[mode];

function openModule(next) {
  if (mode !== next || review) resetReview();
  mode = next;
  review = null;
  if (!state.attempts[mode]) state.attempts[mode] = newAttempt();
  save();
  render();
  tick();
}


let reviewFilter = "all";
let chatQuestion = null;
const chatThreads = new Map();

function hasReview() {
  return mode === "reading" && Boolean(data.explanations && attempt().submittedAt);
}
function matchesFilter(question) {
  if (!hasReview() || reviewFilter === "all") return true;
  const answers = attempt().answers;
  if (!normalize(answers[question.id])) return reviewFilter === "unanswered";
  return reviewFilter === "wrong" && !isCorrect(question, answers);
}
function resetReview() {
  reviewFilter = "all";
  chatQuestion = null;
  chatThreads.clear();
}
function renderReviewFilters() {
  const filters = $("#review-filters");
  filters.hidden = !hasReview();
  filters.innerHTML = filters.hidden ? "" : [
    ["all", "All questions"], ["wrong", "Wrong answers"], ["unanswered", "Unanswered"]
  ].map(([value, label]) => `<button data-filter="${value}" aria-pressed="${value === reviewFilter}">${label}</button>`).join("");
}
function renderEvidenceText(block, ranges, from, to, excerpts) {
  let position = from;
  let html = "";
  for (const excerpt of excerpts) {
    const offset = block.indexOf(excerpt);
    const start = Math.max(position, offset);
    const end = Math.min(to, offset + excerpt.length);
    if (offset < 0 || end <= start) continue;
    html += highlightedText(block, ranges, position, start);
    html += `<span class="evidence">${highlightedText(block, ranges, start, end)}</span>`;
    position = end;
  }
  return html + highlightedText(block, ranges, position, to);
}
function jumpToEvidence() {
  const passage = $("#passage");
  const mark = passage.querySelector(".evidence");
  if (!mark) return;
  passage.scrollTop += mark.getBoundingClientRect().top - passage.getBoundingClientRect().top - 24;
}
function selectQuestion(number) {
  if (chatQuestion !== number) chatQuestion = null;
  currentQuestion = number;
  const next = data.groups.findIndex(group => number >= group.first && number <= group.last);
  if (next !== groupIndex) {
    groupIndex = next;
    renderReading();
  } else {
    renderNumbers();
    if (hasReview()) {
      renderPassage();
      renderChat();
    }
  }
  const target = $("#review-q" + number) || $("#q" + number);
  target?.focus({preventScroll: true});
  target?.scrollIntoView({block: hasReview() ? "nearest" : "center"});
  if (hasReview()) jumpToEvidence();
}
function reviewPhrase(value) {
  return normalize(value.normalize("NFKC").replace(/[‘’]/g, "'"))
    .replace(/[^a-z0-9'-]+/g, " ").trim().replace(/^'+|'+$/g, "");
}

function reviewReply(message, number) {
  const activeGroup = data.groups.find(group => number >= group.first && number <= group.last);
  const passage = data.passages[activeGroup.passage];
  const passageQuestions = data.groups.filter(group => group.passage === activeGroup.passage)
    .flatMap(group => group.questions);
  const references = /\b(?:q(?:uestion)?|#)\s*(\d+)\b|第\s*(\d+)\s*题/gi;
  const referenced = [...new Set([...message.normalize("NFKC").matchAll(references)]
    .map(match => Number(match[1] || match[2])))];
  if (referenced.some(id => !passageQuestions.some(question => question.id === id))) {
    return "这道题在另一篇文章。请切到对应文章再问。";
  }
  if (referenced.length > 1) return "可以问同一篇里的其他题，请一次指定一道题。";
  number = referenced[0] ?? number;
  const entry = data.explanations[number];
  const question = passageQuestions.find(item => item.id === number);
  const group = data.groups.find(item => number >= item.first && number <= item.last);
  const example = Object.keys(entry.terms)[0];
  const unrecognized = `我暂时没找到这句话对应的解析。你可以贴出想问的英文，或点「原文怎么理解」。例如「${example} 啥意思」。`;
  const articleNotes = passageQuestions.map(item => data.explanations[item.id]);
  const knownTerms = Object.assign({}, ...articleNotes.map(item => item.terms), entry.terms);
  const prompt = message.normalize("NFKC").toLowerCase().replace(references, "")
    .trim().replace(/^[：:,，\s]+|[？?。.!！\s]+$/g, "").replace(/\s+/g, " ");
  const sourceQuestion = prompt.replace(/^(?:这(?:一)?道题|这题|本题|当前题)\s*的?\s*(?=原文|这句|证据)/, "");
  const evidence = entry.evidence.map(([, excerpt]) => excerpt);
  const cue = [...entry.reason.matchAll(/“([^”]+)”/g)]
    .map(match => match[1])
    .find(quote => evidence.some(excerpt =>
      ` ${reviewPhrase(excerpt)} `.includes(` ${reviewPhrase(quote)} `)));
  const answer = `答案是 ${question.answer}。 ${entry.reason}`;
  const articleSummary = articleNotes.find(item => item.passageSummary)?.passageSummary;
  if (/^(?:这篇(?:文章)?|整篇(?:文章)?|文章|全文)(?:的)?(?:大意(?:是什么)?|主旨(?:是什么)?|讲(?:的是|了)?什么|(?:是)?什么意思|怎么理解)$/.test(prompt) && articleSummary) return articleSummary;
  if (!prompt && referenced.length) return answer;
  const contrast = entry.contrast + (cue && !entry.contrast.includes(cue) ? `\n原文定位 · “${cue}”` : "");

  if (/^(?:(?:请|能不能|可以|能)?(?:帮我)?)?(?:为什么(?:选这个(?:答案)?|是这个答案|选它|这个答案对|这题(?:对|选这个))?|正确答案|解释(?:一下)?(?:这道题|这题|本题)?(?:吗)?|why|why is this correct|explain(?: this question)?)$/.test(prompt)) return answer;
  if (/^(?:为什么(?:我错了|我的答案不对|不选其他(?:选项)?)|易错点|选项对比|why not the others|compare|why is my answer wrong)$/.test(prompt)) return contrast;
  if (/^(?:原文在哪(?:里)?|原文证据|定位|答案在哪(?:里)?|where is the evidence|evidence)$/.test(prompt)) return evidence.join("\n\n");
  if (/^(?:关键词|词汇|vocabulary)$/.test(prompt)) return Object.entries(entry.terms).map(([word, meaning]) => `${word} · ${meaning}`).join("\n");
  if (/^(?:原文|题干|这题|这道题)?(?:哪里|哪部分|怎么)?(?:对应|同义替换)(?:的|是什么|在哪里)?$/.test(prompt)) return entry.reason;

  const candidate = prompt.match(/^(?:为什么(?:不(?:是|选|填)|(?:没|不能)(?:选|填)|是|选|填)?|why (?:not|is it))\s*(.+)$/)?.[1];
  if (candidate && /^[a-z0-9\s’'()£.‘“”"-]+$/.test(candidate)) {
    const option = candidate.replace(/^[“”‘’"'\s]+|[“”‘’"'\s]+$/g, "");
    if (isCorrect(question, {[number]: option})) return answer;
    const validChoice = group.choices?.some(choice => normalize(choice) === option);
    const userAnswer = normalize(attempt().answers[number]);
    const known = Object.hasOwn(entry.terms, option) || (" " + reviewPhrase(entry.contrast) + " ").includes(" " + reviewPhrase(option) + " ");
    if (option && (validChoice || known || userAnswer === option)) return contrast;
  }

  if (/^(?:请|帮我|能不能|可以)?\s*(?:翻译(?:一下)?(?:这句(?:话)?|原文|证据句)|(?:这句(?:话)?|原文|证据句)(?:怎么理解|(?:是)?什么意思|啥意思|什么含义|怎么翻译|讲的是什么|说的什么)|translate (?:this sentence|the passage|the evidence))$/.test(sourceQuestion)) {
    return `原文 · ${evidence.join("\n\n")}\n\n${entry.translation ? "译文 · " + entry.translation : "本题相关句意 · " + entry.reason}`;
  }

  // Read the English phrase within a Chinese question or a common English vocabulary question.
  const english = prompt.match(/\bwhat (?:does|do) (.+?) (?:mean|refer to|stand for)\b/)?.[1]
    || prompt.match(/^(?:what (?:is|are)|define|meaning of)\s+(.+)$/)?.[1];
  const meaningQuestion = /意思|含义|指代|指什么|指的是|怎么理解|怎么翻译|是什么|什么是|什么来[的着]|区别|差别|对应|是.{0,25}吗$/.test(prompt);
  const barePhrase = /^[“”‘’"'a-z][a-z\s'’“-]*[a-z’”"']$/.test(prompt);
  const targets = english ? [english] : (prompt.match(/[a-z][a-z0-9'-]*(?: +[a-z0-9][a-z0-9'-]*)*/g) || []);
  const explanations = [];
  for (const phrase of new Set(targets.map(reviewPhrase))) {
    const short = phrase.replace(/^(?:the|a|an) /, "");
    const target = Object.hasOwn(knownTerms, short) ? short : phrase;
    if (Object.hasOwn(knownTerms, target)) {
      explanations.push(`${target} · ${knownTerms[target]}`);
      continue;
    }
    if ((!english && !meaningQuestion && !barePhrase) || target.length < 3) continue;
    const inText = text => (" " + reviewPhrase(text) + " ").includes(" " + target + " ");
    const current = [...evidence, question.text, ...Object.values(question.options || {})].find(inText);
    const paragraph = current || passage.blocks.find(inText);
    if (paragraph) {
      const sentence = paragraph.split(/(?<=[.!?])\s+(?=[A-Z“‘])/).find(inText) || paragraph;
      const context = current ? `\n结合本题 · ${entry.reason}` : "";
      explanations.push(`“${target}” 出现在这句里 · ${sentence}${context}\n这个用法暂无单独释义。`);
    }
  }
  return explanations.length ? explanations.join("\n\n") : unrecognized;
}
function appendChat(messages, type, value) {
  const row = document.createElement("p");
  const label = document.createElement("strong");
  label.textContent = type + " · ";
  row.append(label, document.createTextNode(value));
  row.style.whiteSpace = "pre-wrap";
  messages.append(row);
  messages.scrollTop = messages.scrollHeight;
}
function renderChat() {
  const panel = $("#review-chat");
  if (!panel) return;
  panel.hidden = !hasReview() || chatQuestion !== currentQuestion || !data.explanations[chatQuestion];
  if (panel.hidden) return;
  panel.querySelector("h3").textContent = `题目解析 · Q${chatQuestion}`;
  const messages = panel.querySelector(".review-messages");
  messages.replaceChildren();
  for (const [type, value] of chatThreads.get(chatQuestion) || []) appendChat(messages, type, value);
}
function askReview(message) {
  if (!message || !hasReview() || chatQuestion !== currentQuestion || !data.explanations[chatQuestion]) return;
  const thread = chatThreads.get(chatQuestion) || [];
  thread.push(["你", message], ["解析", reviewReply(message, chatQuestion)]);
  chatThreads.set(chatQuestion, thread.slice(-20));
  renderChat();
}

function renderNumbers() {
  $("#numbers").innerHTML = mode === "reading" ? questions.filter(matchesFilter).map(question => {
    const active = attempt();
    const answered = Boolean(normalize(active.answers[question.id]));
    const result = active.submittedAt ? (isCorrect(question, active.answers) ? "right" : "wrong") : "";
    const flag = active.flags[question.id];
    return `<button data-jump="${question.id}" class="${answered ? "answered" : ""} ${flag ? "flagged" : ""} ${result}" aria-label="Question ${question.id}${flag ? ", flagged" : ""}" aria-current="${question.id === currentQuestion}">${question.id}</button>`;
  }).join("") : "";
}
function renderSummary() {
  const active = attempt();
  const summary = $("#summary");
  summary.hidden = !active.submittedAt;
  summary.textContent = mode === "reading"
    ? `Reading score · ${grade(active.answers)} / 40`
    : `Writing saved · Task 1: ${countWords(active.drafts[0])} words · Task 2: ${countWords(active.drafts[1])} words`;
  if (review) summary.textContent = "Past attempt · " + summary.textContent;
}

function highlightedText(block, ranges, from, to) {
  let position = from;
  let html = "";
  for (const [start, end] of ranges) {
    const markStart = Math.max(start, from);
    const markEnd = Math.min(end, to);
    if (markEnd <= markStart) continue;
    html += escapeHtml(block.slice(position, markStart)) + "<mark>" + escapeHtml(block.slice(markStart, markEnd)) + "</mark>";
    position = markEnd;
  }
  return html + escapeHtml(block.slice(position, to));
}

function renderPassage() {
  selection = [];
  const group = data.groups[groupIndex];
  const passage = data.passages[group.passage];
  const target = $("#passage");
  const explanation = hasReview() ? data.explanations[currentQuestion] : null;
  const notGiven = questions.find(question => question.id === currentQuestion)?.answer === "NOT GIVEN";
  const label = explanation ? `<p class="review-label">Q${currentQuestion} · ${notGiven ? "Relevant text · the passage does not confirm the claim" : "Answer evidence"}</p>` : "";
  target.innerHTML = label + `<h1>${escapeHtml(passage.title)}</h1>` + passage.blocks.map((block, i) => {
    const ranges = attempt().highlights[`${group.passage}:${i}`] || [];
    const heading = passage.headings?.[i] || "";
    const letter = passage.labels?.[i];
    const boundary = Math.max(heading.length, letter ? 1 : 0);
    const excerpts = (explanation?.evidence || []).filter(([index]) => index === i).map(([, text]) => text);
    const body = renderEvidenceText(block, ranges, boundary, block.length, excerpts);
    const badge = letter ? `<strong class="passage-letter">${renderEvidenceText(block, ranges, 0, 1, excerpts)}</strong>` : "";
    if (!heading) return `<p data-block="${i}">${badge}${body}</p>`;

    const title = renderEvidenceText(block, ranges, letter ? 1 : 0, boundary, excerpts);
    const className = boundary === block.length ? ' class="passage-heading-only"' : "";
    return `<p data-block="${i}"${className}><strong class="passage-subheading" role="heading" aria-level="2">${badge}${title}</strong>${body}</p>`;
  }).join("");
  updateSelectionTools();
}

function answerBox(number, active) {
  return `<input class="blank" data-answer="${number}" aria-label="Answer ${number}" autocomplete="off"
    spellcheck="false" value="${escapeHtml(active.answers[number] || "")}" ${active.submittedAt ? "disabled" : ""}>`;
}
function flagButton(number, active) {
  return active.submittedAt ? "" : `<button class="flag" data-flag="${number}" aria-label="Flag question ${number}"
    aria-pressed="${Boolean(active.flags[number])}">Flag</button>`;
}
function resultMarkup(question, active) {
  const correct = isCorrect(question, active.answers);
  return `<p class="key ${correct ? "right-text" : "wrong-text"}">${correct ? "Correct" : "Incorrect"} · Your answer:
    ${escapeHtml(active.answers[question.id] || "—")} · Answer key: <strong>${escapeHtml(question.answer)}</strong></p>` +
    (hasReview() ? `<div class="review-actions"><button data-evidence="${question.id}">Locate evidence</button><button data-explain="${question.id}" lang="zh">题目解析</button></div>` : "");
}
function worksheetMarkup(group, active) {
  const [title, ...blocks] = group.worksheet;
  const contents = blocks.map(block => `<p>${escapeHtml(block).replace(/\[\[(\d+)\]\]/g, (_, id) =>
    `<span class="worksheet-blank" id="q${id}" tabindex="-1"><strong class="qnum">${id}</strong>${answerBox(id, active)}${flagButton(id, active)}</span>`
  )}</p>`).join("");
  const results = active.submittedAt ? group.questions.filter(matchesFilter).map(question =>
    `<div class="q" id="review-q${question.id}" tabindex="-1"><strong class="qnum">${question.id}.</strong>${resultMarkup(question, active)}</div>`
  ).join("") : "";
  return `<div class="worksheet ${group.kind === "Flow-chart completion" ? "flow" : ""}"><h3>${escapeHtml(title)}</h3>${contents}</div>${results}`;
}
function questionMarkup(question, group, active) {
  const number = question.id;
  const answer = active.answers[number] || "";
  const disabled = active.submittedAt ? "disabled" : "";
  const box = answerBox(number, active);
  const prompt = escapeHtml(question.text);
  const text = prompt.includes("[[blank]]") ? prompt.replace("[[blank]]", box) : prompt;
  const options = group.choices.map(choice => {
    const description = question.options?.[choice];
    return `<label><input type="radio" name="q${number}" data-answer="${number}" value="${escapeHtml(choice)}"
      ${answer === choice ? "checked" : ""} ${disabled}> ${escapeHtml(choice)}${description ? " · " + escapeHtml(description) : ""}</label>`;
  }).join("");
  const result = active.submittedAt ? resultMarkup(question, active) : "";
  return question.leads.map(lead => `<p class="notes-lead">${escapeHtml(lead)}</p>`).join("") +
    `<div class="q" id="q${number}" tabindex="-1"><div class="qtop">
      <span class="qnum">${number}.</span><p class="qtext">${text}</p>${flagButton(number, active)}
      </div>${options ? `<div class="options ${question.options?.A ? "long" : ""}" role="group" aria-label="Answer ${number}">${options}</div>`
        : prompt.includes("[[blank]]") ? "" : `<div class="options">${box}</div>`}${result}</div>`;
}
function groupQuestions(group, active) {
  const visibleQuestions = group.questions.filter(matchesFilter);
  if (!visibleQuestions.length) return '<p class="muted">No matching questions in this group.</p>';
  if (group.sourceImage) {
    const answers = visibleQuestions.map(question => questionMarkup(question, group, active)).join("");
    return `<div class="source-layout"><figure class="source-sheet">
      <img src="data:image/jpeg;base64,${group.sourceImage}" alt="Original layout for questions ${group.first}–${group.last}">
      </figure><section class="source-answers" aria-label="Answer fields"><h3>Your answers</h3>${answers}</section></div>`;
  }
  if (group.worksheet?.length) return worksheetMarkup(group, active);
  const labels = Object.entries(group.choiceLabels || {});
  const choiceList = labels.length ? `<div class="choice-list">${labels.map(([key, label]) =>
    `<div><strong>${escapeHtml(key)}</strong><span>${escapeHtml(label)}</span></div>`).join("")}</div>` : "";
  const legacyNotes = group.kind === "Note completion" ? "<h3>Achieving a better work-life balance</h3>" : "";
  return choiceList + legacyNotes + visibleQuestions.map(question => questionMarkup(question, group, active)).join("");
}
function renderReading() {
  selection = [];
  const active = attempt();
  const group = data.groups[groupIndex];
  renderReviewFilters();
  $("#sections").innerHTML = data.groups.map((item, index) =>
    `<button data-group="${index}" aria-pressed="${index === groupIndex}">Q${item.first}–${item.last}</button>`
  ).join("");
  renderNumbers();
  $("#workspace").innerHTML = `
    <section class="panel"><div class="panel-bar"><span class="eyebrow">Reading passage</span>
      <div class="panel-tools">
        ${active.submittedAt ? "" : '<button id="highlight" disabled>Highlight selection</button><button id="clear-selection" disabled>Clear selection</button><button id="clear-all" title="Clear all highlights in this passage" disabled>Clear all</button>'}
        <button id="save-vocabulary" title="Select a word or phrase of up to 180 characters" disabled>Add to vocabulary</button>
        <button id="open-vocabulary">Passage vocabulary</button>
      </div><span id="vocab-selection-status" role="status"></span>
    </div><article class="scroll passage" id="passage"></article></section>
    <section class="panel"><div class="panel-bar"><span class="eyebrow">Questions ${group.first}–${group.last}</span><span class="muted" id="reading-progress"></span></div>
      <div class="scroll" id="questions"><h2>${group.kind}</h2><p class="muted">${escapeHtml(group.instruction)}</p>
      ${group.kind === "True / False / Not Given" ? '<p class="muted"><strong>TRUE</strong> if the statement agrees with the information<br><strong>FALSE</strong> if it contradicts the information<br><strong>NOT GIVEN</strong> if there is no information on this</p>' : ""}
      ${groupQuestions(group, active)}</div>
      ${hasReview() ? `<aside id="review-chat" class="review-chat" lang="zh" aria-labelledby="review-chat-title" hidden>
        <div class="dialog-head"><h3 id="review-chat-title">题目解析</h3><button type="button" data-close-chat>关闭</button></div>
        <p class="muted">可以问这篇原文里的词、短语、句意，也可以问本篇其他题。</p>
        <div class="review-messages" role="log" aria-live="polite" aria-label="解析对话"></div>
        <div class="actions"><button type="button" data-ask="为什么选这个">为什么选这个</button><button type="button" data-ask="为什么不选其他">为什么不选其他</button><button type="button" data-ask="这题原文什么意思">原文怎么理解</button><button type="button" data-ask="关键词">关键词</button></div>
        <form id="review-chat-form"><input aria-label="追问本题" maxlength="180" placeholder="例如：这句话怎么理解？" required><button type="submit">发送</button></form>
      </aside>` : ""}</section>`;
  renderPassage();
  renderChat();
  updateProgress();
  if (vocabulary.isOpen()) openPassageVocabulary(undefined, false);
}
function updateProgress() {
  $("#reading-progress").textContent =
    questions.filter(question => normalize(attempt().answers[question.id])).length + " / 40 answered";
}
function writingPromptMarkup(prompt) {
  const lines = prompt.trim().split(/\r?\n/).map(line => line.trim());
  const heading = lines.shift();
  const timeIndex = lines.findIndex(line => /^You should spend about /i.test(line));
  const essay = /TASK 2$/i.test(heading);
  const essayIntro = essay ? lines.findIndex(line => /^Write about the following topic/i.test(line)) : -1;
  const introIndex = essayIntro >= 0 ? essayIntro : timeIndex;
  const requirementsIndex = lines.findIndex(line => /^(?:Give reasons for your answer|Write at least \d+ words)/i.test(line));
  if (introIndex < 0 || requirementsIndex <= introIndex) return `<p class="writing-plain">${escapeHtml(prompt)}</p>`;

  const paragraphs = text => text.trim().split(/\n{2,}/).filter(Boolean)
    .map(paragraph => `<p>${escapeHtml(paragraph.replace(/\n/g, " "))}</p>`).join("");
  const topic = lines.slice(introIndex + 1, requirementsIndex).join("\n")
    .replace(/\n(?=Write (?:a letter|an email))/gi, "\n\n");
  const [context, ...bullets] = topic.split(/\n\s*[•●]\s*/);
  const list = bullets.length ? `<ul>${bullets.map(item => `<li>${escapeHtml(item.replace(/\s+/g, " ").trim())}</li>`).join("")}</ul>` : "";
  const requirements = lines.slice(requirementsIndex);
  const end = requirements.findIndex(line => essay ? /^Write at least \d+ words/i.test(line) : /^Dear\b/i.test(line));
  const salutation = !essay && end >= 0 ? requirements[end].replace(/^Dear\s{2,},$/, "Dear …,") : "";
  const rules = end < 0 ? requirements : requirements.slice(0, end + (essay ? 1 : 0));
  const rulesMarkup = essay ? paragraphs(rules.join("\n")) :
    rules.filter(Boolean).map(line => `<p>${escapeHtml(line).replace(/\bNOT\b/g, "<strong>NOT</strong>")}</p>`).join("");
  return `<h1 class="writing-task-title">${escapeHtml(heading)}</h1>
    <p class="writing-time">${escapeHtml(lines[timeIndex] || "")}</p>
    ${essayIntro >= 0 ? `<p>${escapeHtml(lines[essayIntro])}</p>` : ""}
    <div class="writing-topic">${paragraphs(context)}${list}</div>
    <div class="writing-requirements">${rulesMarkup}
    ${salutation ? `<p class="writing-salutation">${escapeHtml(salutation)}</p>` : ""}</div>`;
}
function renderWriting() {
  vocabulary.closeReading();
  renderReviewFilters();
  const active = attempt();
  const task = data.writing[writingIndex];
  $("#sections").innerHTML = data.writing.map((_, index) =>
    `<button data-task="${index}" aria-pressed="${index === writingIndex}">Task ${index + 1}</button>`
  ).join("");
  renderNumbers();
  $("#workspace").innerHTML = `
    <section class="panel"><div class="panel-bar"><span class="eyebrow">Writing prompt</span><button id="open-writing-notes">词语积累</button></div>
      <div class="scroll passage writing-prompt">${writingPromptMarkup(task.prompt)}</div></section>
    <section class="panel"><div class="panel-bar"><span class="eyebrow">Your response</span><span id="word-count"></span></div>
      <textarea class="editor" id="draft" aria-label="Writing response" spellcheck="false" ${active.submittedAt ? "readonly" : ""} placeholder="Type your response here…"></textarea>
      ${active.submittedAt && task.reference ? `<details><summary>${task.model ? "Book model answer" : "Book sample and examiner comments"}</summary><img src="data:image/jpeg;base64,${task.reference}" alt="Writing Task ${writingIndex + 1} reference response from the book">${(task.extraReferences || []).map((image, index) => `<img src="data:image/jpeg;base64,${image}" alt="Reference continuation, page ${index + 2}">`).join("")}</details>` : ""}</section>`;
  $("#draft").value = active.drafts[writingIndex];
  updateWordCount();
}
function updateWordCount() {
  $("#word-count").textContent = countWords($("#draft").value) + " words · minimum " + data.writing[writingIndex].minimum;
}
function render() {
  $("#reading-tab").setAttribute("aria-pressed", mode === "reading");
  $("#writing-tab").setAttribute("aria-pressed", mode === "writing");
  $("#submit").textContent = review ? "Back to current" : attempt().submittedAt ? "New attempt" : "Submit";
  selection = [];
  renderSummary();
  if (mode === "reading") renderReading();
  else renderWriting();
  showTime();
}
function captureSelection() {
  const passage = $("#passage");
  if (!passage || mode !== "reading") return;
  selection = [];
  const selected = window.getSelection();
  if (selected.rangeCount && !selected.isCollapsed) {
    const range = selected.getRangeAt(0);
    if (passage.contains(range.startContainer) && passage.contains(range.endContainer)) {
      for (const block of passage.querySelectorAll("[data-block]")) {
        if (!range.intersectsNode(block)) continue;
        const prefix = document.createRange();
        prefix.selectNodeContents(block);
        let start = 0;
        let end = block.textContent.length;
        if (block.contains(range.startContainer)) {
          prefix.setEnd(range.startContainer, range.startOffset);
          start = prefix.toString().length;
        }
        if (block.contains(range.endContainer)) {
          prefix.setEnd(range.endContainer, range.endOffset);
          end = prefix.toString().length;
        }
        if (end > start) selection.push([block.dataset.block, start, end]);
      }
    }
  }
  updateSelectionTools();
}

function selectedPassageText() {
  const passage = data.passages[data.groups[groupIndex].passage];
  return selection.map(([block, start, end]) => passage.blocks[block].slice(start, end)).join(" ")
    .replace(/\s+/g, " ").trim();
}

function updateSelectionTools() {
  const add = $("#save-vocabulary");
  if (!add) return;
  const text = selectedPassageText();
  add.disabled = !/[\p{L}\p{N}]/u.test(text) || text.length > vocabulary.maxSelectionLength;
  const highlightButton = $("#highlight");
  if (!highlightButton) return;
  const highlights = attempt().highlights;
  const prefix = data.groups[groupIndex].passage + ":";
  highlightButton.disabled = !text;
  $("#clear-selection").disabled = !selection.some(([block, start, end]) =>
    (highlights[prefix + block] || []).some(([left, right]) => start < right && end > left));
  $("#clear-all").disabled = !Object.keys(highlights).some(key => key.startsWith(prefix));
}

function refreshHighlights() {
  window.getSelection().removeAllRanges();
  save();
  renderPassage();
}

function highlight() {
  if (!selection.length || attempt().submittedAt) return;
  const highlights = attempt().highlights;
  for (const [block, start, end] of selection) {
    const key = `${data.groups[groupIndex].passage}:${block}`;
    const sorted = [...(highlights[key] || []), [start, end]].sort((a, b) => a[0] - b[0]);
    highlights[key] = sorted.reduce((ranges, range) => {
      const previous = ranges.at(-1);
      if (previous && range[0] <= previous[1]) previous[1] = Math.max(previous[1], range[1]);
      else ranges.push(range);
      return ranges;
    }, []);
  }
  refreshHighlights();
}

function clearSelectedHighlights() {
  if (!selection.length || attempt().submittedAt) return;
  const highlights = attempt().highlights;
  for (const [block, start, end] of selection) {
    const key = `${data.groups[groupIndex].passage}:${block}`;
    if (!highlights[key]) continue;
    const remaining = highlights[key].flatMap(([left, right]) => {
      if (right <= start || left >= end) return [[left, right]];
      const pieces = [];
      if (left < start) pieces.push([left, start]);
      if (right > end) pieces.push([end, right]);
      return pieces;
    });
    if (remaining.length) highlights[key] = remaining;
    else delete highlights[key];
  }
  refreshHighlights();
}

function clearAllHighlights() {
  if (attempt().submittedAt) return;
  const highlights = attempt().highlights;
  const prefix = data.groups[groupIndex].passage + ":";
  for (const key of Object.keys(highlights)) {
    if (key.startsWith(prefix)) delete highlights[key];
  }
  refreshHighlights();
}

function openPassageVocabulary(focusKey, focus = true) {
  const passage = data.groups[groupIndex].passage;
  vocabulary.open({
    title: "Vocabulary · " + data.passages[passage].title,
    tests: [{key: data.vocabularyKey}],
    passage,
    focusKey,
    focus
  });
}

function saveSelectedVocabulary() {
  const text = selectedPassageText();
  if (!text || $("#save-vocabulary").disabled) return;
  const passage = data.groups[groupIndex].passage;
  const {title} = data.passages[passage];
  try {
    const key = vocabulary.add(data.vocabularyKey, passage, title, text);
    $("#vocab-selection-status").textContent = "";
    window.getSelection().removeAllRanges();
    openPassageVocabulary(key);
  } catch {
    $("#vocab-selection-status").textContent = "Could not save vocabulary in this browser.";
  }
}

function finish(module) {
  const active = state.attempts[module];
  if (active.submittedAt) return;
  active.submittedAt = Date.now();
  state.history.unshift({module, ...JSON.parse(JSON.stringify(active))});
  save();
}
function showTime() {
  const active = attempt();
  $("#start-timer").hidden = Boolean(active.deadline || active.submittedAt);
  const remaining = active.deadline ? Math.max(0, Math.ceil((active.deadline - Date.now()) / 1000)) : 3600;
  $("#clock").textContent = active.submittedAt ? "Finished"
    : [Math.floor(remaining / 60), remaining % 60].map(number => String(number).padStart(2, "0")).join(":");
}
function tick() {
  let rerender = false;
  for (const [module, active] of Object.entries(state.attempts)) {
    if (!active.submittedAt && active.deadline && Date.now() >= active.deadline) {
      finish(module);
      if (module === mode && !review) rerender = true;
    }
  }
  if (rerender) render();
  else showTime();
}
function showHistory() {
  $("#history-list").innerHTML = state.history.length ? state.history.map((entry, index) => {
    const detail = entry.module === "reading" ? `${grade(entry.answers)} / 40`
      : `${countWords(entry.drafts[0])} + ${countWords(entry.drafts[1])} words`;
    return `<div class="history-row"><div><strong>${entry.module === "reading" ? "Reading" : "Writing"}</strong> · ${detail}<br>
      <small class="muted">${escapeHtml(new Date(entry.submittedAt).toLocaleString())}</small></div>
      <button data-review="${index}">Review</button></div>`;
  }).join("") : "<p class='muted'>Submitted attempts will appear here.</p>";
  $("#history").showModal();
}
$("#reading-tab").onclick = () => openModule("reading");
$("#writing-tab").onclick = () => openModule("writing");
$("#history-button").onclick = showHistory;
function startTimer() {
  const active = attempt();
  if (!active.deadline && !active.submittedAt) {
    active.deadline = Date.now() + 60 * 60 * 1000;
    save();
    showTime();
  }
}
$("#start-timer").onclick = startTimer;
$("#submit").onclick = () => {
  if (review) {
    openModule(mode);
    return;
  }
  if (attempt().submittedAt) {
    state.attempts[mode] = newAttempt();
    resetReview();
    currentQuestion = null;
    groupIndex = writingIndex = 0;
    save();
    render();
    return;
  }
  $("#submit-dialog").returnValue = "";
  $("#submit-dialog").showModal();
};
$("#submit-dialog").onclose = event => {
  if (event.target.returnValue === "submit") {
    finish(mode);
    render();
  }
};
$("#sections").onclick = event => {
  const button = event.target.closest("button");
  if (!button) return;
  if (mode === "reading") {
    groupIndex = Number(button.dataset.group);
    currentQuestion = null;
    chatQuestion = null;
    renderReading();
  } else {
    writingIndex = Number(button.dataset.task);
    renderWriting();
  }
};
$("#review-filters").onclick = event => {
  const filter = event.target.closest("[data-filter]")?.dataset.filter;
  if (!hasReview() || !filter) return;
  reviewFilter = filter;
  chatQuestion = null;
  currentQuestion = null;
  const group = data.groups.findIndex(item => item.questions.some(matchesFilter));
  if (group >= 0) groupIndex = group;
  renderReading();
  $("#review-filters").querySelector('[aria-pressed="true"]').focus();
};
$("#numbers").onclick = event => {
  const button = event.target.closest("[data-jump]");
  if (button) selectQuestion(Number(button.dataset.jump));
};
$("#workspace").onclick = event => {
  const button = event.target.closest("button");
  if (!button) return;
  if (button.dataset.evidence) selectQuestion(Number(button.dataset.evidence));
  if (button.dataset.explain && hasReview()) {
    const number = Number(button.dataset.explain);
    selectQuestion(number);
    chatQuestion = number;
    if (!chatThreads.has(number)) askReview("为什么选这个");
    else renderChat();
    $("#review-chat input").focus();
  }
  if (button.hasAttribute("data-close-chat")) {
    const number = chatQuestion;
    chatQuestion = null;
    renderChat();
    $(`[data-explain="${number}"]`)?.focus();
  }
  if (button.dataset.ask) askReview(button.dataset.ask);
  if (button.id === "highlight") highlight();
  if (button.id === "clear-selection") clearSelectedHighlights();
  if (button.id === "clear-all") clearAllHighlights();
  if (button.id === "save-vocabulary") saveSelectedVocabulary();
  if (button.id === "open-vocabulary") openPassageVocabulary();
  if (button.id === "open-writing-notes") vocabulary.openWritingNotes();
  if (button.dataset.flag) {
    const number = button.dataset.flag;
    const flags = attempt().flags;
    flags[number] = !flags[number];
    button.setAttribute("aria-pressed", flags[number]);
    save();
    renderNumbers();
  }
};
$("#workspace").addEventListener("submit", event => {
  if (event.target.id !== "review-chat-form") return;
  event.preventDefault();
  const input = event.target.querySelector("input");
  const value = input.value.trim();
  if (!value) return;
  input.value = "";
  askReview(value);
});
$("#workspace").oninput = event => {
  const input = event.target;
  if (attempt().submittedAt) return;
  if (input.dataset.answer) {
    startTimer();
    attempt().answers[input.dataset.answer] = input.value;
    currentQuestion = Number(input.dataset.answer);
    save();
    renderNumbers();
    updateProgress();
  }
  if (input.id === "draft") {
    startTimer();
    attempt().drafts[writingIndex] = input.value;
    save();
    updateWordCount();
  }
};
$("#history-list").onclick = event => {
  const button = event.target.closest("[data-review]");
  if (!button) return;
  resetReview();
  review = state.history[Number(button.dataset.review)];
  mode = review.module;
  groupIndex = writingIndex = 0;
  currentQuestion = null;
  $("#history").close();
  render();
};
document.addEventListener("selectionchange", captureSelection);
$("#workspace").addEventListener("pointerdown", event => {
  if (event.target.closest("#highlight, #clear-selection, #save-vocabulary")) event.preventDefault();
});
const parameters = new URLSearchParams(location.search);
if (parameters.has("passage")) {
  const index = data.groups.findIndex(group => String(group.passage) === parameters.get("passage"));
  if (index >= 0) groupIndex = index;
}
openModule(parameters.get("mode") === "writing" ? "writing" : "reading");
setInterval(tick, 500);
</script>
</body>
</html>
